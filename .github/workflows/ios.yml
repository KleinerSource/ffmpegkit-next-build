name: Official FFmpegKitNext iOS
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: actions/cache/restore@v4
        with:
          path: .work/upstream
          key: official-ios-${{ runner.arch }}-${{ hashFiles('sources.lock.json') }}-${{ github.run_id }}
          restore-keys: official-ios-${{ runner.arch }}-${{ hashFiles('sources.lock.json') }}-
      - name: Build official sources
        id: official-build
        run: |
          if [ -f .work/upstream/prebuilt/bundle-apple-xcframework-ios-16.0/ffmpegkit.xcframework/Info.plist ]; then
            python3 build.py --package-only
          else
            python3 build.py
          fi
      - uses: actions/cache/save@v4
        if: always() && steps.official-build.outcome != 'skipped'
        with:
          path: .work/upstream
          key: official-ios-${{ runner.arch }}-${{ hashFiles('sources.lock.json') }}-${{ github.run_id }}
      - name: Test distribution contracts
        run: python3 -m unittest discover -s tests -v
      - name: Compile and test KSPlayer against the new public modules
        timeout-minutes: 25
        env:
          FFMPEGKITNEXT_PACKAGE: ${{ github.workspace }}/dist/pods/FFmpegKitNext
        run: |
          git clone --depth=1 --branch codex/ffmpegkit-next-9.0.2 https://github.com/KleinerSource/KSPlayer.git .work/KSPlayer
          cd .work/KSPlayer
          xcodebuild -scheme KSPlayer -destination 'generic/platform=iOS' -configuration Release CODE_SIGNING_ALLOWED=NO build
          device="$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for group in d["devices"].values() for v in group if "iPhone" in v["name"]))')"
          xcodebuild -scheme KSPlayer -destination "platform=iOS Simulator,id=$device" CODE_SIGNING_ALLOWED=NO test
      - name: Verify CocoaPods application integration
        timeout-minutes: 15
        run: python3 validate_pods.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-diagnostics
          path: |
            .work/upstream/build.log
            .work/upstream/src/ffmpeg/ffbuild/config.log
            dist/official-build-adaptations.diff
      - name: Publish once (never overwrite a released version)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(python3 -c 'import json; print(json.load(open("sources.lock.json"))["release"])')"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists: $tag; increment the rN suffix for a new build."
            exit 1
          fi
          gh release create "$tag" dist/ffmpegkit-next-ios.zip dist/ffmpegkit-next-ios.zip.sha256 dist/release-manifest.json --target "$GITHUB_SHA" --title "$tag" --notes 'Official FFmpeg n9.0.2 + FFmpegKitNext v9.0.2. iOS arm64 and arm64/x86_64 Simulator. No project FFmpeg patches.'
